name: Python Lint & Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Check Linting & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Lint with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Check formatting with Black
        run: |
          black --check .

      - name: Type check with mypy (advisory)
        run: |
          pip install mypy
          mypy --explicit-package-bases copy_topics.py session_string_generator.py telegram_mcp/forum_pagination.py telegram_mcp/job_store.py telegram_mcp/tools/forum_forward.py || true
